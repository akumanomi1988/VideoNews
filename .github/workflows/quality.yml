name: Python quality
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python sources
        run: python -m compileall -q bot scripts news_video_processor.py telegram_bot.py tests
      - name: Install lightweight test dependencies
        run: python -m pip install 'python-telegram-bot>=20,<21' pytest
      - name: Run isolated unit tests
        run: python -m pytest -q tests/test_runtime_and_security.py
      - name: Confirm committed config contains no real credentials
        run: |
          python - <<'PY'
          import json
          cfg=json.load(open('pipeline_config.json',encoding='utf-8'))
          assert not cfg['api_keys']['news_api']
          assert not cfg['api_keys']['pexels_api']
          assert not cfg['oauth']['youtube']['client_secret']
          PY
