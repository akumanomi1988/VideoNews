name: Lightweight verification

# Verify proposed changes before merging; fast offline suite without external API calls.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio python-dotenv requests "python-telegram-bot>=22,<23" "moviepy==1.0.3" "numpy<2.0.0" "Pillow>=10,<11" colorama pydub
      - name: Compile every Python source
        run: |
          python -m compileall -q bot scripts news_video_processor.py telegram_bot.py
      - name: Install system video codec tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run unit and genuine offline FFmpeg integration tests
        run: |
          python -m pytest -q tests/test_runtime_config.py tests/test_telegram_auth.py tests/test_url_safety.py tests/test_tiktok_uploader.py tests/test_job_registry.py tests/test_offline_render_integration.py

  install-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install all default application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Import the actual application and invoke CLI help
        run: |
          python -c "import bot.main; import news_video_processor; import scripts.cli; print('Production Python imports: OK')"
          python -m scripts.cli --help
      - name: Real URL workflow with fake providers and real registry
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_url_workflow_integration.py
