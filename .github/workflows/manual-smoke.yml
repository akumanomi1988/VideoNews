name: Lightweight verification

# Verify proposed changes before merging; fast offline suite without external API calls.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: videonews-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install core dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-mcp.txt
      - name: Compile every Python source
        run: |
          python -m compileall -q scripts news_video_processor.py
      - name: Install system video codec tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run unit and genuine offline FFmpeg integration tests
        run: |
          python -m pytest -q

  install-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install all default application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Import the actual application and invoke CLI help
        run: |
          python -c "import news_video_processor; import scripts.cli; import scripts.studio_mcp; print('Production Python imports: OK')"
          python -m scripts.cli --help
      - name: Real URL workflow with fake providers and real registry
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_url_workflow_integration.py tests/test_news_extractor_extended.py tests/test_dashboard_extended.py tests/test_llm_ollama_compatibility.py
